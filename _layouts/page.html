 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | RC Games</title>
    
    <!-- CUSTOM GRAPHICS & THEME STYLING -->
    <style>
        /* Document Framework & Deep Slate Canvas */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background-color: #000000; /* Main slate background */
            color: #ffffff; /* Crisp content text color */
            margin: 0;
            padding: 0;
        }

        /* Fixed Navigation Interface Header */
        .site-header {
            background-color: #334155; /* Distinct secondary slate panel */
            border-bottom: 2px solid #3b82f6; /* Electric blue branding trace line */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        /* Branding Logotype */
        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation Routing Links Container */
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 600;
            transition: color 0.2s ease-in-out;
        }

        /* Interactive Hover Transitions */
        .nav-links a:hover {
            color: #3b82f6;
        }

        /* Isolated Markdown Content Module */
        .main-content {
            max-width: 850px;
            margin: 3rem auto;
            padding: 2rem;
            background-color: #334155; /* Inner content card framing */
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Automatic Structural Header Normalization */
        .main-content h1 {
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }

        /* Static Page Terminal Footer */
        .site-footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            font-size: 0.875rem;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <!-- CUSTOM NAVIGATION BAR -->
    <header class="site-header">
        <div class="logo">RC Games</div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/releases">Releases</a>
            <a href="/games">Games</a>
            <a href="/socials">Socials</a>
            <a href="/userhelp">User Help</a>
            <a href="/support">Support Us ❤</a>
        </nav>
    </header>

    <!-- CONTENT INJECTION MODULE -->
    <main class="main-content">
        <h1>RC Games | {{ page.title }}</h1>
        {{ content }}
    </main>

    <!-- FOOTER TERMINAL -->
    <footer class="site-footer">
        <p>&copy; 2026-2027 RC Games. All rights reserved.</p>
    </footer>

</body>
</html>
